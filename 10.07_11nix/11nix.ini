; SIMH: 11nix on a PDP-11/23 with 256 KB, an RL02 and a DELQA.
;   gunzip -k 11nix.rl02.gz; pdp11 11nix.ini
; The console is this terminal. The PDP-11 is 10.0.2.15 on SIMH's NAT
; network: telnet localhost 2323 and http://localhost:8080/ reach it.
set cpu 11/23
set cpu 256k
set rl0 rl02
attach rl0 11nix.rl02
set xq enabled
set xq type=delqa
attach xq nat:tcp=2323:10.0.2.15:23,tcp=8080:10.0.2.15:80
boot rl0
